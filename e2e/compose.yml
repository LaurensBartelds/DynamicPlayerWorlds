# e2e compose harness (plan §11 / F11).
#
# Postgres + MinIO + Velocity + 2 Paper nodes. prepare.sh stages jars and
# configs under e2e/runtime/; smoke.sh drives a real player join through the
# proxy onto the lobby backend.
#
# Usage (from repo root, Linux/macOS/Git Bash):
#   e2e/scripts/run.sh
#
# Images and pins live in e2e/versions.env so a bump is one file.

name: gzmn-e2e

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.3}
    environment:
      POSTGRES_USER: gzmn
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:-e2e-postgres-not-for-prod}
      POSTGRES_DB: gzmn_worlds
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gzmn -d gzmn_worlds"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [e2e]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_USER:-gzmn-e2e}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_PASSWORD:-gzmn-e2e-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # The server image has no shell client worth healthchecking; minio-init is
    # the readiness gate the Paper nodes wait on.
    networks: [e2e]

  # Create the worlds bucket once MinIO accepts S3. Uses the dedicated mc image
  # because the server image does not ship the client.
  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then
            echo "minio never became ready" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "local/$${E2E_MINIO_BUCKET}"
        echo "minio bucket ready: $${E2E_MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${E2E_MINIO_USER:-gzmn-e2e}
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_PASSWORD:-gzmn-e2e-secret}
      E2E_MINIO_BUCKET: ${E2E_MINIO_BUCKET:-gzmn-worlds}
    networks: [e2e]
    restart: "no"

  paper-a:
    image: ${JAVA_IMAGE:-eclipse-temurin:25-jre}
    working_dir: /server
    command: ["java", "-Xms512M", "-Xmx1024M", "-XX:+UseG1GC", "-jar", "paper.jar", "--nogui"]
    volumes:
      - ./runtime/paper-a:/server
    ports:
      - "25575:25575"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [e2e]
    stop_grace_period: 30s

  paper-b:
    image: ${JAVA_IMAGE:-eclipse-temurin:25-jre}
    working_dir: /server
    command: ["java", "-Xms512M", "-Xmx1024M", "-XX:+UseG1GC", "-jar", "paper.jar", "--nogui"]
    volumes:
      - ./runtime/paper-b:/server
    ports:
      - "25576:25575"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [e2e]
    stop_grace_period: 30s

  velocity:
    image: ${JAVA_IMAGE:-eclipse-temurin:25-jre}
    working_dir: /server
    command: ["java", "-Xms256M", "-Xmx512M", "-XX:+UseG1GC", "-jar", "velocity.jar"]
    volumes:
      - ./runtime/velocity:/server
    ports:
      - "25565:25565"
    depends_on:
      - paper-a
      - paper-b
    networks: [e2e]
    stop_grace_period: 20s

networks:
  e2e:
    name: gzmn-e2e
