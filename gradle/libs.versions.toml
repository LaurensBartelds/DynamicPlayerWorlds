# The only place a dependency version is written. See CONTRIBUTING.md.
[versions]
# Platform APIs. An MC bump touches these two lines and nothing else.
# paperApi also supplies the +mc<version> suffix on the plugin jars, so it is
# the one line that decides what an artifact claims to target.
#
# Paper follows Minecraft's versioning, which changed after 1.21.11: releases are
# now year.season (26.1, 26.2) and the API coordinate carries the Paper build
# number as `<mc>.build.<n>-stable`. gzmn.plugin-conventions reduces both that
# and the older `1.21.4-R0.1-SNAPSHOT` shape to the Minecraft version alone.
paperApi = "26.2.build.112-stable"
paperApi121 = "1.21.4-R0.1-SNAPSHOT"
velocityApi = "4.0.0"
# Optional at runtime: the proxy uses it to enumerate storage tiers when it is
# installed, and falls back to probing configured nodes when it is not (§4).
luckperms = "5.5"

# Runtime
hikari = "7.1.0"
postgresql = "42.7.13"
flyway = "13.3.0"
slf4j = "2.0.18"
logback = "1.6.3"
logstashEncoder = "9.0"
micrometer = "1.17.0"
awsSdk = "2.53.1"
zstd = "1.5.7-15"
commonsCompress = "1.28.0"
jspecify = "1.0.1"
# Proxy config.toml (specification section 7). Velocity parses its own
# velocity.toml with this, so an operator meets one TOML dialect, not two.
toml4j = "0.7.2"
# toml4j asks for gson 2.8.1; pinned forward to the version both platforms
# already ship, so the relocated copy is current rather than seven years old.
gson = "2.14.0"
checkerQual = "3.49.2"

# Test
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
archunit = "1.5.0"
# Artifact is mockbukkit-v<mc>; bump alongside paperApi when Paper moves.
mockbukkit = "4.116.1"
mockbukkit121 = "4.110.0"

# Build tooling
errorprone = "2.50.0"
nullaway = "0.13.8"
palantirFormat = "2.97.0"
# F10: SBOM on release, licence gate on every check.
cyclonedx = "2.3.1"
licensee = "1.14.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
paper-api-v121 = { module = "io.papermc.paper:paper-api", version.ref = "paperApi121" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocityApi" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
awssdk-urlconnection = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awsSdk" }
zstd = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }
toml4j = { module = "com.moandjiezana.toml:toml4j", version.ref = "toml4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-minio = { module = "org.testcontainers:testcontainers-minio" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Coordinates track the Paper line (mockbukkit-v26.2 for paperApi 26.2.*).
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
mockbukkit-v121 = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit121" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.9.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }
forbiddenapis = { id = "de.thetaphi.forbiddenapis", version = "3.10" }
shadow = { id = "com.gradleup.shadow", version = "8.3.9" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
