# Nightly end-to-end compose harness (plan §11 / F11).
#
# Boots Postgres + MinIO + Velocity + 2 Paper nodes, then drives an offline
# mineflayer client through the proxy onto the lobby backend. Acceptance:
# one player joins a lobby in CI.
name: e2e

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: compose harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run e2e harness
        run: |
          chmod +x e2e/scripts/*.sh
          e2e/scripts/run.sh

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e/runtime/paper-a/logs/
            e2e/runtime/paper-b/logs/
            e2e/runtime/velocity/logs/
          if-no-files-found: ignore
          retention-days: 14
