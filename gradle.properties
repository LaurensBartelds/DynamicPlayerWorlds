group = nl.gzmn.playerworlds
version = 0.1.0-SNAPSHOT

# The JDK every module compiles and runs against. Moving to a newer JDK when
# Paper requires one is this line. See ADR 0003.
#
# Paper 26.x publishes paper-api with a Java 25 target, so a 21 toolchain cannot
# resolve it at all — Gradle refuses the dependency rather than failing later.
javaToolchainVersion = 25

org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
