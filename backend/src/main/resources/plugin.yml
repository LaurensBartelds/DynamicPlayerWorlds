name: gzmn-worlds
version: '${version}'
main: nl.gzmn.playerworlds.backend.GzmnWorldsPlugin
api-version: '${apiVersion}'
description: Private per-player worlds for the GZMN network
authors: [GZMN]
website: https://github.com/LaurensBartelds/DynamicPlayerWorlds
folia-supported: false

commands:
  pworld:
    description: Operator surface for player worlds on this node
    usage: /pworld <create|list|tp|unload|info>  (tp takes <name> or <owner> <name>)
    permission: gzmn.worlds.dev

permissions:
  # Not the player-facing command tree. Section 6 puts /world on the proxy, and
  # this root exists so milestone 1 can drive a node without claiming a
  # namespace the proxy takes in milestone 5 (OQ-15).
  gzmn.worlds.dev:
    description: Drive world create, load and unload directly on a node
    default: op
